        scale: 0.01
        help: "OLP Common RX Power (dBm)"
      - name: ht6000_olp_t1_power_dbm
        oid: 1.3.6.1.4.1.83667.1.1.4.3.3.18
        type: gauge
        scale: 0.01
        help: "OLP T1 Primary Tx Power (dBm)"
      - name: ht6000_olp_t2_power_dbm
        oid: 1.3.6.1.4.1.83667.1.1.4.3.3.19
        type: gauge
        scale: 0.01
        help: "OLP T2 Secondary Tx Power (dBm)"
      - name: ht6000_olp_tx_power_dbm
        oid: 1.3.6.1.4.1.83667.1.1.4.3.3.20
        type: gauge
        scale: 0.01
        help: "OLP Common TX Power (dBm)"
      - name: ht6000_olp_temp_celsius
        oid: 1.3.6.1.4.1.83667.1.1.4.3.3.27
        type: gauge
        scale: 0.01
        help: "OLP Card Temperature (Celsius)"
      - name: ht6000_olp_operating_mode
        oid: 1.3.6.1.4.1.83667.1.1.4.3.3.29
        type: gauge
        help: "OLP Operating Mode (0: Manual, 1: Auto)"
      - name: ht6000_olp_working_link
        oid: 1.3.6.1.4.1.83667.1.1.4.3.3.33
        type: gauge
        help: "OLP Active Working Route (1: Primary/R1, 2: Secondary/R2)"
