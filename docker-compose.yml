services:
  prometheus:
    image: prom/prometheus:latest
    container_name: nms-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  snmp-exporter:
    image: prom/snmp-exporter:latest
    container_name: nms-snmp-exporter
    restart: unless-stopped
    ports:
      - "9116:9116"
    volumes:
      - ./snmp-exporter/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    command:
      - "--config.file=/etc/snmp_exporter/snmp.yml"

  ht6000-simulator:
    image: tandrup/snmpsim:latest
    container_name: nms-ht6000-sim
    restart: unless-stopped
    volumes:
      - ./simulator/data:/usr/local/snmpsim/data:ro

  grafana:
    image: grafana/grafana:latest
    container_name: nms-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prometheus_data:
  grafana_data:
