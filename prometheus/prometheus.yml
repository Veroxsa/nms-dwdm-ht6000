global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "dwdm_ht6000"
    static_configs:
      - targets:
          - ht6000-simulator:161
    metrics_path: /snmp
    params:
      auth: [public_v2]
      module: [ht6000]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: nms-snmp-exporter:9116
